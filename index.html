<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer Networks Midterm Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --paper:#FFFFFF; --ink:#14233A; --muted:#5B6B80; --line:#CBD3DD;
  --blue:#1F5FBF; --green:#23874F; --orange:#E07B2C; --brown:#8A5A3B;
  --ok:#23874F; --okbg:#E3F3EA; --bad:#C8402B; --badbg:#FBE7E3; --sel:#DCE7F8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1722; --paper:#18222F; --ink:#E6ECF3; --muted:#93A2B5; --line:#2C3A4B;
    --blue:#6FA3F0; --green:#5CC28A; --orange:#F2A160; --brown:#C99470;
    --ok:#5CC28A; --okbg:#173326; --bad:#F07A66; --badbg:#3A1E1A; --sel:#1F3352;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1722; --paper:#18222F; --ink:#E6ECF3; --muted:#93A2B5; --line:#2C3A4B;
  --blue:#6FA3F0; --green:#5CC28A; --orange:#F2A160; --brown:#C99470;
  --ok:#5CC28A; --okbg:#173326; --bad:#F07A66; --badbg:#3A1E1A; --sel:#1F3352;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:24px 18px 64px}
h1{font-family:"Archivo","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:8px 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px;max-width:62ch}

/* variant tabs as patch-cable colors */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 15px "Public Sans",sans-serif;padding:10px 16px 10px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.tab .wire{width:26px;height:8px;border-radius:4px;background:var(--c)}
.tab .wire.striped{background:repeating-linear-gradient(90deg,var(--c) 0 5px,#fff 5px 9px)}
.tab[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tab small{color:var(--muted);font-weight:500}
.tab:focus-visible,.opt:focus-visible,.cell:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;color:var(--ink);font:500 14px "Public Sans",sans-serif;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.best{color:var(--muted);font-size:14px}

/* answer sheet like the paper exam */
.sheet{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:22px}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:14px;color:var(--muted)}
.sheet-head strong{color:var(--ink);font-family:"Archivo",sans-serif;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(13,1fr);border:1.5px solid var(--ink);background:var(--paper)}
.cell{appearance:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:3px 0 4px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;min-width:0}
.cell .n{font-size:11px;color:var(--muted);line-height:1.2}
.cell .l{font-family:"Archivo",sans-serif;font-weight:700;font-size:17px;line-height:1.1;min-height:19px}
.cell.ok{background:var(--okbg)} .cell.ok .l{color:var(--ok)}
.cell.bad{background:var(--badbg)} .cell.bad .l{color:var(--bad)}
.cell.blank{visibility:hidden}

.q{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-bottom:14px}
.q h3{margin:0 0 12px;font-size:17px;font-weight:600;line-height:1.4}
.q h3 .num{font-family:"Archivo",sans-serif;font-weight:800;margin-right:6px}
.tag{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px;white-space:nowrap}
.opts{display:grid;gap:6px}
.opt{appearance:none;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:9px 12px;font:inherit;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{font-family:"Archivo",sans-serif;font-weight:700;min-width:18px}
.opt.chosen{background:var(--sel);border-color:var(--blue)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.expl{margin-top:10px;font-size:14.5px;padding:10px 12px;border-left:3px solid var(--ok);background:var(--bg);border-radius:0 6px 6px 0}
.expl.no{border-left-color:var(--bad)}
.expl b{display:block;margin-bottom:2px}

.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:600 15px "Public Sans",sans-serif;padding:11px 18px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.result{width:100%;margin-top:6px;padding:16px;border-radius:10px;background:var(--paper);border:1px solid var(--line);display:none}
.result.show{display:block}
.result .big{font-family:"Archivo",sans-serif;font-weight:800;font-size:34px;line-height:1}
.hidden{display:none}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(9,1fr)}
  .cell .l{font-size:15px}
}
@media (prefers-reduced-motion:no-preference){.opt,.cell{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Computer Networks midterm practice</h1>
  <p class="sub">Variant 1 is the paper test exactly as written. Variants 2–4 follow the same pattern, built only from Lectures 1–5. Every answer comes with a short explanation.</p>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Mode">
      <button id="mPractice" aria-pressed="true">Practice: check each answer</button>
      <button id="mExam" aria-pressed="false">Exam: check at the end</button>
    </div>
    <span class="best" id="best"></span>
  </div>

  <div class="sheet">
    <div class="sheet-head"><span>Answer sheet — tap a number to jump</span><strong id="progress">0 / 25</strong></div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="questions"></div>

  <div class="foot">
    <button class="btn" id="submit">Check my answers</button>
    <button class="btn ghost" id="mistakes" disabled>Show only mistakes</button>
    <button class="btn ghost" id="reset">Start this variant again</button>
    <div class="result" id="result" role="status" aria-live="polite"></div>
  </div>
</div>

["Which Wireshark filter isolates ICMP traffic?",["ip.proto == icmp","icmp","protocol.icmp","Both A and B"],1,"Wireshark display filters use the protocol name directly: icmp. The IP protocol field is numeric (ip.proto == 1), so ip.proto == icmp is not valid.","L2"],

["What is the purpose of the FCS field in an Ethernet frame?",["IP addressing","CRC error detection","Data encryption","Speed autonegotiation"],1,"The Frame Check Sequence (4-byte trailer) holds a CRC value. The receiver recalculates it; a mismatch means the frame is corrupt and dropped.","L4"],
["Which transport protocol provides connection-oriented reliable delivery?",["UDP","IP","TCP","ICMP"],2,"TCP manages conversations, guarantees delivery and does flow control. UDP is connectionless; IP is best effort.","L2"],

const L = ["A","B","C","D"];
let cur = 1, mode = "practice";
const state = {}; // variant -> {ans:[], checked:bool, onlyMistakes:bool}
function st(v){ if(!state[v]) state[v]={ans:Array(V[v].qs.length).fill(null),checked:false,only:false}; return state[v]; }
function store(get,k,val){ try{ if(get) return localStorage.getItem(k); localStorage.setItem(k,val);}catch(e){ return null; } }

const tabs=document.getElementById("tabs"), grid=document.getElementById("grid"), qbox=document.getElementById("questions");
const res=document.getElementById("result"), btnSubmit=document.getElementById("submit"), btnMist=document.getElementById("mistakes");

function renderTabs(){
  tabs.innerHTML="";
  Object.keys(V).forEach(k=>{
    const b=document.createElement("button");
    b.className="tab"; b.setAttribute("role","tab"); b.setAttribute("aria-selected",String(+k===cur));
    b.style.setProperty("--c",V[k].c);
    b.innerHTML=`<span class="wire ${V[k].striped?"striped":""}"></span>${V[k].name}${V[k].note?` <small>${V[k].note}</small>`:""}`;
    b.onclick=()=>{cur=+k;render();window.scrollTo({top:0});};
    tabs.appendChild(b);
  });
}

function reveal(i){ const s=st(cur); return mode==="practice" ? s.ans[i]!==null : s.checked; }

function render(){
  renderTabs();
  const s=st(cur), qs=V[cur].qs;
  // answer sheet
  grid.innerHTML="";
  const cols = window.matchMedia("(max-width:560px)").matches?9:13;
  qs.forEach((q,i)=>{
    const c=document.createElement("button"); c.className="cell";
    const a=s.ans[i];
    if(a!==null && reveal(i)) c.classList.add(a===q[2]?"ok":"bad");
    c.innerHTML=`<span class="n">${i+1}</span><span class="l">${a===null?"":L[a]}</span>`;
    c.setAttribute("aria-label",`Question ${i+1}${a===null?", not answered":", answered "+L[a]}`);
    c.onclick=()=>document.getElementById("q"+i).scrollIntoView({behavior:"smooth",block:"start"});
    grid.appendChild(c);
  });
  const pad=(cols-qs.length%cols)%cols; for(let p=0;p<pad;p++){const e=document.createElement("span");e.className="cell blank";grid.appendChild(e);}
  const answered=s.ans.filter(x=>x!==null).length;
  document.getElementById("progress").textContent=`${answered} / ${qs.length}`;

  // questions
  qbox.innerHTML="";
  qs.forEach((q,i)=>{
    const a=s.ans[i], show=reveal(i), wrong=show&&a!==q[2];
    const d=document.createElement("section"); d.className="q"; d.id="q"+i;
    if(s.only && s.checked && !wrong && a!==null) d.classList.add("hidden");
    if(s.only && s.checked && a===null) d.classList.remove("hidden");
    let h=`<h3><span class="num">${i+1}.</span>${q[0]}<span class="tag">Lecture ${q[4]}</span></h3><div class="opts">`;
    q[1].forEach((o,j)=>{
      let cls="opt";
      if(show){ if(j===q[2]) cls+=" right"; else if(j===a) cls+=" wrong"; }
      else if(j===a) cls+=" chosen";
      h+=`<button class="${cls}" data-q="${i}" data-o="${j}" ${show?"disabled":""}><span class="k">${L[j]})</span><span>${o}</span></button>`;
    });
    h+="</div>";
    if(show){
      const ok=a===q[2];
      h+=`<div class="expl ${ok?"":"no"}"><b>${a===null?"Not answered — correct answer: "+L[q[2]]:ok?"Correct":"Not quite — correct answer: "+L[q[2]]}</b>${q[3]}</div>`;
    }
    d.innerHTML=h; qbox.appendChild(d);
  });
  qbox.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.q, j=+b.dataset.o; st(cur).ans[i]=j;
    render();
    if(mode==="practice" && st(cur).ans.every(x=>x!==null)) finish();
  });

  // footer
  btnSubmit.classList.toggle("hidden", mode==="practice" || s.checked);
  btnMist.disabled=!s.checked;
  btnMist.textContent=s.only?"Show all questions":"Show only mistakes";
  if(!s.checked) res.classList.remove("show"); else showResult();
  const best=store(true,"cnq-best-"+cur);
  document.getElementById("best").textContent=best?`Best on ${V[cur].name}: ${best} / ${qs.length}`:"";
}

function score(){ const s=st(cur); return V[cur].qs.reduce((n,q,i)=>n+(s.ans[i]===q[2]?1:0),0); }
function showResult(){
  const n=score(), t=V[cur].qs.length, pct=Math.round(n/t*100);
  const wrongNums=V[cur].qs.map((q,i)=>st(cur).ans[i]!==q[2]?i+1:null).filter(Boolean);
  res.innerHTML=`<div class="big">${n} / ${t}</div><div>${pct}% correct. ${wrongNums.length?"Review questions "+wrongNums.join(", ")+".":"Every answer is right — try the next variant."}</div>`;
  res.classList.add("show");
}
function finish(){
  const s=st(cur); s.checked=true;
  const n=score(), prev=+(store(true,"cnq-best-"+cur)||0);
  if(n>prev) store(false,"cnq-best-"+cur,String(n));
  render(); res.scrollIntoView({behavior:"smooth",block:"center"});
}

btnSubmit.onclick=()=>{
  const s=st(cur), left=s.ans.filter(x=>x===null).length;
  if(left && !confirm(`${left} question(s) are not answered yet. Check anyway?`)) return;
  finish();
};
btnMist.onclick=()=>{ const s=st(cur); s.only=!s.only; render(); };
document.getElementById("reset").onclick=()=>{ delete state[cur]; render(); window.scrollTo({top:0}); };

function setMode(m){
  mode=m;
  document.getElementById("mPractice").setAttribute("aria-pressed",String(m==="practice"));
  document.getElementById("mExam").setAttribute("aria-pressed",String(m==="exam"));
  Object.keys(state).forEach(k=>delete state[k]);
  render();
}
document.getElementById("mPractice").onclick=()=>setMode("practice");
document.getElementById("mExam").onclick=()=>setMode("exam");
window.matchMedia("(max-width:560px)").addEventListener("change",render);
render();
</script>
</body>
</html>
